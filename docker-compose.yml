# StockSmart - configuration is passed via environment variables.
# `env_file` reads the same KEY=VALUE format as config.env, so your existing
# config file works as-is. To override a single value without editing the
# file, use the `environment` block:
#
# services:
#   stocksmart:
#     ...
#     environment:
#       POLL_INTERVAL: "60"
#       STORE_IDS: "131,145"
#
# One container watches one product at every store in STORE_IDS. Running one
# container per product (each with its own env file) is how you watch several
# products, since the bot exits after delivering its first alert.
#
services:
  stocksmart:
    build:
      context: .
    image: stocksmart
    env_file:
      - config.env
    # The bot exits after delivering its alert (fire exactly once);
    # on-failure restarts only on crashes, not on that clean exit
    restart: on-failure
